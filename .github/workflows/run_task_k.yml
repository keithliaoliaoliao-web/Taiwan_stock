name: Run Universe Investigation

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 抓取完整 git log 以便追溯 config.py 歷史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pytz

      - name: Run Investigation
        run: python investigate_universe.py

      - name: Upload Audit CSV
        uses: actions/upload-artifact@v4
        with:
          name: universe-audit-artifact
          path: universe_listing_audit.csv
