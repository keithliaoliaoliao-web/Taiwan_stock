name: Run Task K Verification

on:
  workflow_dispatch:

jobs:
  run-task-k:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pytz

      - name: Run Task K
        run: python run_task_k.py

      - name: Upload Report & Trades CSV
        uses: actions/upload-artifact@v4
        with:
          name: task-k-artifacts
          path: |
            task_k_trades_base_indep.csv
            task_k_trades_base_no_ov.csv
            task_k_report.md
