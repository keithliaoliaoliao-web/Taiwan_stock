name: Taiwan Stock Scanner

on:
  schedule:
    - cron: '30 7 * * 1-5'      # 台灣時間 15:30 收盤掃描 (UTC 07:30)
    - cron: '*/30 1-5 * * 1-5'  # 台灣時間 09:00-13:30 盤中每30分鐘 (UTC 01:00-05:30)
  workflow_dispatch:              # 允許手動觸發

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run scanner
        run: python scanner.py
        
      - name: Commit scan result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/scan_result.json watchlist.csv
          git diff --staged --quiet || git commit -m "chore: update scan result"
          git push
