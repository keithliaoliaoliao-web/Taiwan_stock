name: Daily Scan (Price Action)

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 台灣時間 18:30
    - cron: '30 13 * * 1-5'   # 台灣時間 21:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price action scanner
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python price_action_scanner.py

      - name: Anonymize holdings_status in scan_result.json
        run: |
          python - <<'PY'
          import json
          for p in ('scan_result.json', 'public/scan_result.json'):
              try:
                  with open(p, encoding='utf-8') as f:
                      d = json.load(f)
              except FileNotFoundError:
                  continue
              d['holdings_status'] = []
              with open(p, 'w', encoding='utf-8') as f:
                  json.dump(d, f, ensure_ascii=False, separators=(',', ':'))
          PY

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan_result.json
          [ -f public/scan_result.json ] && git add public/scan_result.json
          git diff --staged --quiet || git commit -m "chore: update scan results ($(TZ=Asia/Taipei date +%F))"
          git pull --rebase
          git push
