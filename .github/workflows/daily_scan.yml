name: Daily Paper Trading

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 台灣時間 18:30 (第一次嘗試；資料沒到就安靜結束)
    - cron: '30 13 * * 1-5'   # 台灣時間 21:30 (最後一次；資料還沒到就顯示紅叉)
  workflow_dispatch:
    inputs:
      resolve_ticker:
        description: '解除 NEEDS_REVIEW 的股票代號，例如 2327.TW (日常請留空)'
        required: false
        default: ''
      resolve_action:
        description: '解除方式：adjust 或 close (日常請留空)'
        required: false
        default: ''
      resolve_price:
        description: '搭配 close 的出場價 (日常請留空)'
        required: false
        default: ''
      resolve_date:
        description: '搭配 close 的出場日 YYYY-MM-DD (日常請留空)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          IS_FINAL: ${{ github.event.schedule != '30 10 * * 1-5' }}
          RESOLVE_TICKER: ${{ github.event.inputs.resolve_ticker }}
          RESOLVE_ACTION: ${{ github.event.inputs.resolve_action }}
          RESOLVE_PRICE: ${{ github.event.inputs.resolve_price }}
          RESOLVE_DATE: ${{ github.event.inputs.resolve_date }}
        run: |
          if [ -n "$RESOLVE_TICKER" ]; then
            python scanner.py --resolve "$RESOLVE_TICKER" --action "$RESOLVE_ACTION" ${RESOLVE_PRICE:+--price "$RESOLVE_PRICE"} ${RESOLVE_DATE:+--date "$RESOLVE_DATE"}
          elif [ "$IS_FINAL" = "true" ]; then
            python scanner.py --final
          else
            python scanner.py
          fi

      - name: Run price action scanner
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python price_action_scanner.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading_ledger.csv
          if [ -f dashboard_data.json ]; then git add dashboard_data.json; fi
          if [ -f scan_result.json ]; then git add scan_result.json; fi
          if [ -f public/scan_result.json ]; then git add public/scan_result.json; fi
          if [ -f holdings.json ]; then git add holdings.json; fi
          git diff --staged --quiet || git commit -m "chore: update scan results ($(TZ=Asia/Taipei date +%F))"
          git pull --rebase
          git push
