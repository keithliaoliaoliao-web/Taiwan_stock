name: Taiwan Stock Scanner

on:
  schedule:
    - cron: '12,42 1-5 * * 1-5'
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-scanner-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit scan result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update scan result and holdings"
          git push
