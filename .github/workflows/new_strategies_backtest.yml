name: New Strategies Backtest (Donchian + Momentum)

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Backtest start (YYYY-MM-DD)'
        required: true
        default: '2024-01-02'
        type: string

permissions:
  contents: read

concurrency:
  group: new-strategy-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run new strategies backtest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python new_strategy_backtest.py --start "${{ inputs.start }}" --end "2026-11-02"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: new-strategy-results
          path: |
            bt_donchian.csv
            bt_momentum.csv
          retention-days: 90
