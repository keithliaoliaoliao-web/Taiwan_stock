name: Backtest Freeze Rerun

on:
  workflow_dispatch:
    inputs:
      segment:
        description: '觀察池分段'
        required: true
        type: choice
        options: ['1-50', '51-100', '101-150']
        default: '1-50'
      start:
        description: '開始日期（YYYY-MM-DD）'
        required: true
        default: '2024-01-02'
        type: string
      end:
        description: '結束日期（YYYY-MM-DD）'
        required: true
        default: '2026-11-02'
        type: string
      strategy:
        description: '策略'
        required: true
        type: choice
        options: [bom, h2, mtr, wedge, all]
        default: bom
      variant:
        description: '變體（full=C版調整後+股利；nodiv=B版調整後無股利；raw_div=D版原始+股利）'
        required: true
        type: choice
        options: [full, nodiv, raw_div]
        default: full
      max_positions:
        description: '最大並行倉位數'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: freeze-rerun-${{ inputs.segment }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve tickers for segment
        id: sel
        run: |
          case "${{ inputs.segment }}" in
            1-50)   LO=1;  HI=50  ;;
            51-100) LO=51; HI=100 ;;
            101-150) LO=101; HI=150 ;;
            *) echo "invalid segment"; exit 1 ;;
          esac
          TICKERS=$(python -c "import csv; wl=list(csv.DictReader(open('watchlist.csv', encoding='utf-8-sig'))); print(','.join(r['ticker'] for r in wl[$LO-1:$HI]))")
          echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"
          echo "Segment tickers: $TICKERS"

      - name: Run backtest for segment
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          EXTRA=""
          case "${{ inputs.variant }}" in
            nodiv)  EXTRA="--no-dividend-income" ;;
            raw_div) EXTRA="--no-adjustment" ;;
          esac
          OUT="bt_${{ inputs.strategy }}_${{ inputs.variant }}_${{ inputs.segment }}.csv"
          python backtest.py \
            --tickers "${{ steps.sel.outputs.tickers }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --strategy "${{ inputs.strategy }}" \
            --exit-mode v1 \
            --max-positions "${{ inputs.max_positions }}" \
            $EXTRA \
            --out "$OUT"

      - name: Upload frozen evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt_${{ inputs.strategy }}_${{ inputs.variant }}_${{ inputs.segment }}
          path: bt_*.csv
          retention-days: 90
