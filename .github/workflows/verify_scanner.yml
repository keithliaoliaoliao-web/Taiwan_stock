name: Verify Scanner Against Task K

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pytz

      - name: Verify Updated Source Hashes Before Running
        run: |
          echo "=== Run Timestamp (UTC) ===" | tee build_meta.txt
          date -u +"%Y-%m-%d %H:%M:%S UTC" | tee -a build_meta.txt
          echo "=== Git Commit Hash ===" | tee -a build_meta.txt
          git rev-parse HEAD | tee -a build_meta.txt
          echo "=== Current File MD5 ===" | tee -a build_meta.txt
          md5sum data_fetcher.py run_task_k.py scanner.py test_split_handling.py | tee -a build_meta.txt
          # 防呆檢查：若 scanner.py 仍是舊版 19a01005... 則直接報錯中止，避免打包舊檔
          if md5sum scanner.py | grep -q "19a0100554e8f27912a26b506e8eda66"; then
            echo "【致命錯誤】scanner.py 仍是舊版 (19a01005...)，尚未更新為 object 型態修正版！"
            exit 1
          fi

      - name: Generate Task K Benchmark CSVs
        run: python run_task_k.py

      - name: Run Split, Backfill, CLI Resolve, Idempotency & Freshness Unit Tests
        run: python test_split_handling.py 2>&1 | tee unit_tests_raw.log

      - name: Run Diagnostics on Mismatches and Volume Drops
        run: python diagnose_mismatches.py

      - name: Run Extended Replay (Three Periods with --replay-auto-resolve-splits)
        run: python scanner.py --extended-verify --replay-auto-resolve-splits 2>&1 | tee scanner_extended_verify_raw.log

      - name: Compute File Hashes and Package Source Files
        run: |
          mkdir -p export_src
          cp data_fetcher.py run_task_k.py scanner.py test_split_handling.py build_meta.txt export_src/
          cd export_src
          md5sum data_fetcher.py run_task_k.py scanner.py test_split_handling.py > file_hashes.txt
          cat file_hashes.txt

      - name: Upload All Verification Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-full-verification-suite
          path: |
            unit_tests_raw.log
            scanner_extended_verify_raw.log
            replay_diff_2023_h2.csv
            replay_extra_2023_h2.csv
            replay_diff_2025_h1.csv
            replay_extra_2025_h1.csv
            replay_diff_2026_h1.csv
            replay_extra_2026_h1.csv
            diag_2308.csv
            diag_2880.csv
            diag_dropped_volume_bars.csv
            export_src/file_hashes.txt
            export_src/build_meta.txt
            export_src/data_fetcher.py
            export_src/run_task_k.py
            export_src/scanner.py
            export_src/test_split_handling.py
