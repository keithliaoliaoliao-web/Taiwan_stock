name: Verify Scanner Against Task K

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pytz

      - name: Generate Task K Benchmark CSVs
        run: python run_task_k.py

      - name: Run Extended Replay (Three Periods Check)
        run: python scanner.py --extended-verify | tee scanner_extended_verify_raw.log

      - name: Upload Replay Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-multi-period-verification
          path: |
            scanner_extended_verify_raw.log
            replay_diff_2023_h2.csv
            replay_extra_2023_h2.csv
            replay_diff_2025_h1.csv
            replay_extra_2025_h1.csv
            replay_diff_2026_h1.csv
            replay_extra_2026_h1.csv
