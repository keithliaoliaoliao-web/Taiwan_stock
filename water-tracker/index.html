<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💧 每日喝水打卡</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .wave-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
        }
    </style>
</head>
<body class="wave-bg min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur-md shadow-xl rounded-3xl p-8 max-w-md w-full border border-sky-100">
        <!-- 標題與日期 -->
        <div class="text-center mb-6">
            <span class="text-xs font-semibold tracking-wider text-sky-600 bg-sky-100 px-3 py-1 rounded-full uppercase">Daily Hydration</span>
            <h1 class="text-3xl font-bold text-slate-800 mt-2">💧 每天喝水打卡</h1>
            <p id="current-date" class="text-slate-500 text-sm mt-1"></p>
        </div>

        <!-- 進度圓環/條 -->
        <div class="mb-8">
            <div class="flex justify-between items-baseline mb-2">
                <span class="text-slate-600 font-medium">今日進度</span>
                <span class="text-2xl font-bold text-sky-600"><span id="current-ml">0</span> <span class="text-sm font-normal text-slate-500">/ <span id="goal-ml">2000</span> ml</span></span>
            </div>
            <!-- 進度條 -->
            <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-sky-400 to-blue-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
            <p id="encouragement" class="text-center text-sm font-medium text-sky-700 mt-3 bg-sky-50 py-2 rounded-xl border border-sky-100">加油！多喝水保持健康 ✨</p>
        </div>

        <!-- 按鈕操作區 -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="addWater(250)" class="bg-sky-500 hover:bg-sky-600 text-white font-medium py-3 px-4 rounded-2xl shadow-md shadow-sky-200 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span class="text-lg">+</span> 🥤 小杯 (250 ml)
            </button>
            <button onclick="addWater(500)" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-2xl shadow-md shadow-blue-200 transition transform active:scale-95 flex items-center justify-center gap-2">
                <span class="text-lg">+</span> 🥛 大杯 (500 ml)
            </button>
        </div>

        <!-- 自訂水量與重設 -->
        <div class="flex gap-2 mb-6">
            <input type="number" id="custom-ml" placeholder="自訂毫升數" class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sm">
            <button onclick="addCustomWater()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-2 rounded-2xl text-sm transition">新增</button>
        </div>

        <!-- 底部功能 -->
        <div class="flex justify-between items-center text-sm text-slate-400 pt-4 border-t border-slate-100">
            <button onclick="resetWater()" class="hover:text-rose-500 transition">重新計算今日</button>
            <span>目標：2000 ml</span>
        </div>
    </div>

    <script>
        const GOAL = 2000;
        let todayData = {
            date: '',
            ml: 0
        };

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        }

        function init() {
            // 顯示今天日期
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-TW', options);
            document.getElementById('goal-ml').innerText = GOAL;

            // 讀取 LocalStorage
            const saved = localStorage.getItem('water_tracker');
            const todayStr = getTodayString();

            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.date === todayStr) {
                    todayData = parsed;
                } else {
                    todayData = { date: todayStr, ml: 0 };
                }
            } else {
                todayData = { date: todayStr, ml: 0 };
            }

            updateUI();
        }

        function save() {
            localStorage.setItem('water_tracker', JSON.stringify(todayData));
        }

        function addWater(amount) {
            todayData.ml += amount;
            save();
            updateUI();
        }

        function addCustomWater() {
            const input = document.getElementById('custom-ml');
            const val = parseInt(input.value);
            if (!isNaN(val) && val > 0) {
                addWater(val);
                input.value = '';
            }
        }

        function resetWater() {
            if (confirm('確定要重設今天的喝水紀錄嗎？')) {
                todayData.ml = 0;
                save();
                updateUI();
            }
        }

        function updateUI() {
            const ml = todayData.ml;
            document.getElementById('current-ml').innerText = ml;

            const percentage = Math.min(Math.round((ml / GOAL) * 100), 100);
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = percentage + '%';

            const encouragement = document.getElementById('encouragement');
            if (ml >= GOAL) {
                encouragement.innerText = "🎉 太棒了！今天已經達成喝水目標囉！";
                encouragement.className = "text-center text-sm font-medium text-emerald-700 mt-3 bg-emerald-50 py-2 rounded-xl border border-emerald-100";
            } else if (ml >= GOAL * 0.5) {
                encouragement.innerText = "👍 已經喝了一半以上了，繼續保持！";
                encouragement.className = "text-center text-sm font-medium text-sky-700 mt-3 bg-sky-50 py-2 rounded-xl border border-sky-100";
            } else {
                encouragement.innerText = "加油！多喝水保持健康 ✨";
                encouragement.className = "text-center text-sm font-medium text-sky-700 mt-3 bg-sky-50 py-2 rounded-xl border border-sky-100";
            }
        }

        // 初始化
        init();
    </script>
</body>
</html>
