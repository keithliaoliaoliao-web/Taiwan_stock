name: Taiwan Stock Scanner

on:
  schedule:
    - cron: '30 7 * * 1-5'      # 台灣時間 15:30 收盤完整掃描
    - cron: '*/15 1-5 * * 1-5'  # 台灣時間 09:00-13:30 盤中每 15 分鐘掃描
  workflow_dispatch:            # 支援於 GitHub Actions 介面手動觸發

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit scan result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/scan_result.json watchlist.csv
          git diff --staged --quiet || git commit -m "chore: update scan result [skip ci]"
          git push
